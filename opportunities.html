<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational Opportunities</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.5;
            color: #333;
            background: url('webq/main-bg.webp') center center fixed;
            background-size: cover;
            background-repeat: no-repeat;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 3rem 0;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="75" cy="75" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="50" cy="10" r="0.5" fill="rgba(255,255,255,0.05)"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
            opacity: 0.3;
        }

        .header h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            position: relative;
            z-index: 2;
            font-weight: 700;
        }

        .header p {
            font-size: 1.3rem;
            max-width: 700px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
            opacity: 0.95;
            font-weight: 300;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .nav {
            background: rgba(255, 255, 255, 0.98);
            padding: 1.2rem 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            color: #667eea;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #4a5568;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-links a:hover {
            color: #667eea;
        }

        .nav-links a.active {
            color: #667eea;
        }

        .nav-links a.active::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
        }

        .search-filter {
            background: white;
            padding: 2.5rem;
            margin: 3rem 0;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
        }

        .filter-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 2rem;
            text-align: center;
        }

        .filter-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .filter-group label {
            font-weight: 700;
            color: #4a5568;
            font-size: 1rem;
        }

        .filter-input {
            padding: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .filter-input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .opportunities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 2.5rem;
            margin: 3rem 0;
        }

        .opportunity-card {
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            transition: all 0.4s ease;
            border: 1px solid #e2e8f0;
            position: relative;
            overflow: hidden;
        }

        .opportunity-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .opportunity-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
        }

        .card-header {
            margin-bottom: 2rem;
        }

        .institution-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 0.8rem;
            line-height: 1.3;
        }

        .country-badge {
            display: inline-block;
            padding: 0.4rem 1rem;
            background: linear-gradient(135deg, #f7fafc, #edf2f7);
            color: #4a5568;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 1rem;
            border: 1px solid #e2e8f0;
        }

        .program-info {
            background: #f8fafc;
            padding: 1.5rem;
            border-radius: 15px;
            margin-bottom: 1.5rem;
            border-left: 4px solid #667eea;
        }

        .program-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 0.5rem;
        }

        .program-description {
            color: #718096;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .opportunity-details {
            display: grid;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 1rem;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .detail-icon {
            width: 24px;
            text-align: center;
            color: #667eea;
            font-size: 1.1rem;
        }

        .detail-text {
            flex: 1;
            font-size: 0.95rem;
        }

        .detail-label {
            font-weight: 700;
            color: #4a5568;
            display: block;
            margin-bottom: 0.2rem;
        }

        .detail-value {
            color: #718096;
            line-height: 1.4;
        }

        .apply-button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 1rem 1.8rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            letter-spacing: 0.5px;
        }

        .apply-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .apply-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .deadline-urgent {
            background: #fed7d7;
            color: #c53030;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .deadline-normal {
            color: #38a169;
            font-weight: 600;
        }

        .no-results {
            text-align: center;
            padding: 4rem;
            background: white;
            border-radius: 20px;
            color: #718096;
            grid-column: 1 / -1;
        }

        .no-results i {
            font-size: 4rem;
            margin-bottom: 2rem;
            color: #cbd5e0;
        }

        .no-results h3 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: #4a5568;
        }

        .loading {
            text-align: center;
            padding: 4rem;
            color: #718096;
            font-size: 1.2rem;
        }

        @media (max-width: 1024px) {
            .opportunities-grid {
                grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
                gap: 2rem;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5rem;
            }
            
            .header p {
                font-size: 1.1rem;
            }
            
            .nav-links {
                display: none;
            }
            
            .opportunities-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            
            .container {
                padding: 0 1rem;
            }
            
            .filter-controls {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            
            .search-filter {
                padding: 2rem 1.5rem;
                margin: 2rem 0;
            }
            
            .opportunity-card {
                padding: 2rem;
            }
        }

        @media (max-width: 480px) {
            .header {
                padding: 2rem 0;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .logo {
                font-size: 1.5rem;
            }
            
            .opportunity-card {
                padding: 1.5rem;
            }
        }

        .format-badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            background: #e6fffa;
            color: #065f46;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-left: 0.5rem;
        }

        .online-badge {
            background: #dbeafe;
            color: #1e40af;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #667eea;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .nav-links {
                display: flex;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: white;
                flex-direction: column;
                padding: 1rem;
                box-shadow: 0 4px 20px rgba(0,0,0,0.1);
                transform: translateY(-100%);
                opacity: 0;
                visibility: hidden;
                transition: all 0.3s ease;
            }
            
            .nav-links.active {
                transform: translateY(0);
                opacity: 1;
                visibility: visible;
            }
            
            .mobile-menu-btn {
                display: block;
            }
        }

        .search-filter, .opportunity-card {
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

        </div>

        <!-- Opportunities Grid -->
        <div class="opportunities-grid" id="opportunities-container">

        </div>
    </main>

        // DOM elements
        const searchInput = document.getElementById('search');
        const formatFilter = document.getElementById('format');
        const opportunitiesContainer = document.getElementById('opportunities-container');
        const scholarshipFilter = document.getElementById('scholarship');
        const degreeTypeFilter = document.getElementById('degreeType');
        const feeFilter = document.getElementById('fee');
        const estimatedCostFilter = document.getElementById('estimatedCost');
        const accreditationFilter = document.getElementById('accreditation');

        // Get unique values for filters
        function getUniqueValues(data, field) {
            return [...new Set(data.map(item => item[field]).filter(value => value && value.trim() !== ''))].sort();
        }

        // Populate filter options
        function populateFilters() {

            const formats = getUniqueValues(opportunitiesData, 'Format ');
            formats.forEach(format => {
                const option = document.createElement('option');
                option.value = format;
                option.textContent = format;
                formatFilter.appendChild(option);
            });

            const scholarships = getUniqueValues(opportunitiesData, 'Scholarship');
            scholarships.forEach(s => {
                const option = document.createElement('option');
                option.value = s;
                option.textContent = s;
                scholarshipFilter.appendChild(option);
            });

            const degreeTypes = getUniqueValues(opportunitiesData, 'DegreeType');
            degreeTypes.forEach(d => {
                const option = document.createElement('option');
                option.value = d;
                option.textContent = d;
                degreeTypeFilter.appendChild(option);
            });

            const fees = getUniqueValues(opportunitiesData, 'OpportunityType');
            fees.forEach(f => {
                const option = document.createElement('option');
                option.value = f;
                option.textContent = f;
                feeFilter.appendChild(option);
            });
            const costCategories = [
                { label: 'Free', min: 0, max: 0 },
                { label: '$1 – $500', min: 1, max: 500 },
                { label: '$501 – $2,000', min: 501, max: 2000 },
                { label: '$2,001 – $10,000', min: 2001, max: 10000 },
                { label: '$10,001+', min: 10001, max: Infinity },
                { label: 'Varies per course', min: null, max: null }
            ];
            costCategories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat.label;
                option.textContent = cat.label;
                estimatedCostFilter.appendChild(option);
            });
            const accreditations = getUniqueValues(opportunitiesData, 'Accreditation');
            accreditations.forEach(a => {
                const option = document.createElement('option');
                option.value = a;
                option.textContent = a;
                accreditationFilter.appendChild(option);
            });
        }

        // Get country flag emoji
        function getCountryFlag(country) {
            const flags = {
                'USA': '🇺🇸',
                'UK': '🇬🇧',
                'Germany': '🇩🇪',
                'Germany/International': '🌍',
                'USA/International': '🌍',
                'Scotland': '🏴󠁧󠁢󠁳󠁣󠁴󠁿',
                'Spain': '🇪🇸',
                'Canada': '🇨🇦',
                'Afghanistan': '🇦🇫',
                'International': '🌍'
            };
            return flags[country] || '🌍';
        }

        // Check if deadline is urgent (within 30 days)
        function isDeadlineUrgent(deadline) {
            if (!deadline || deadline.toLowerCase().includes('rolling') || deadline.toLowerCase().includes('different')) {
                return false;
            }
            
            try {
                const deadlineDate = new Date(deadline);
                const today = new Date();
                const thirtyDaysFromNow = new Date(today.getTime() + (30 * 24 * 60 * 60 * 1000));
                return deadlineDate <= thirtyDaysFromNow && deadlineDate >= today;
            } catch {
                return false;
            }
        }

        // Create opportunity card HTML
        function createOpportunityCard(opportunity) {
            const isUrgent = isDeadlineUrgent(opportunity.Deadline);
            const flag = getCountryFlag(opportunity.Country);
            const format = opportunity['Format '] || '';
            
            return `
                <div class="opportunity-card" data-country="${opportunity.Country}" data-language="${opportunity.Language}" data-format="${format}">
                    <div class="card-header">
                        <h3 class="institution-name">${opportunity.Institution}</h3>
                        <div class="country-badge">
                            ${flag} ${opportunity.Country || 'International'}
                            ${format ? `<span class="format-badge ${format.toLowerCase() === 'online' ? 'online-badge' : ''}">${format}</span>` : ''}
                        </div>
                    </div>
                    
                    ${opportunity.Program || opportunity.Department ? `
                        <div class="program-info">
                            <div class="program-title">${opportunity.Program || opportunity.Department}</div>
                            ${opportunity.Details ? `<div class="program-description">${opportunity.Details.substring(0, 200)}${opportunity.Details.length > 200 ? '...' : ''}</div>` : ''}
                        </div>
                    ` : ''}
                    
                    <div class="opportunity-details">
                        ${opportunity.Duration ? `
                            <div class="detail-item">
                                <i class="fas fa-clock detail-icon"></i>
                                <div class="detail-text">
                                    <span class="detail-label">Duration</span>
                                    <span class="detail-value">${opportunity.Duration}</span>
                                </div>
                            </div>
                        ` : ''}
                        
                        ${opportunity.Language ? `
                            <div class="detail-item">
                                <i class="fas fa-language detail-icon"></i>
                                <div class="detail-text">
                                    <span class="detail-label">Language</span>
                                    <span class="detail-value">${opportunity.Language}</span>
                                </div>
                            </div>
                        ` : ''}

                        ${opportunity.DegreeType ? `
                            <div class="detail-item">
                                <i class="fas fa-graduation-cap detail-icon"></i>
                                <div class="detail-text">
                                    <span class="detail-label">Degree Type</span>
                                    <span class="detail-value">${opportunity.DegreeType}</span>
                                </div>
                            </div>
                        ` : ''}
                        
                        ${opportunity.Fee ? `
                            <div class="detail-item">
                                <i class="fas fa-layer-group detail-icon"></i>
                                <div class="detail-text">
                                    <span class="detail-label">Fee </span>
                                    <span class="detail-value">${opportunity.Fee}${opportunity.Scholarship ? ' • ' + opportunity.Scholarship + ' Scholarship' : ''}</span>
                                </div>
                            </div>
                        ` : ''}
                        
                        ${opportunity.Deadline ? `
                            <div class="detail-item">
                                <i class="fas fa-calendar-alt detail-icon"></i>
                                <div class="detail-text">
                                    <span class="detail-label">Deadline</span>
                                    <span class="detail-value ${isUrgent ? 'deadline-urgent' : 'deadline-normal'}">${opportunity.Deadline}</span>
                                </div>
                            </div>
                        ` : ''}
                        ${opportunity.EstimatedCost ? `
                            <div class="detail-item">
                                <i class="fas fa-dollar-sign detail-icon"></i>
                                <div class="detail-text">
                                    <span class="detail-label">Estimated Cost</span>
                                    <span class="detail-value">${opportunity.EstimatedCost}</span>
                                </div>
                            </div>
                        ` : ''}
                        
                        ${opportunity.Accreditation ? `
                            <div class="detail-item">
                                <i class="fas fa-certificate detail-icon"></i>
                                <div class="detail-text">
                                    <span class="detail-label">Accreditation</span>
                                    <span class="detail-value">${opportunity.Accreditation}</span>
                                </div>
                            </div>
                        ` : ''}
                        
                        ${opportunity.Requirements ? `
                            <div class="detail-item">
                                <i class="fas fa-clipboard-list detail-icon"></i>
                                <div class="detail-text">
                                    <span class="detail-label">Requirements</span>
                                    <span class="detail-value">${opportunity.Requirements.substring(0, 100)}${opportunity.Requirements.length > 100 ? '...' : ''}</span>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                    
                    <button class="apply-button" onclick="window.open('${opportunity.Link}', '_blank')">
                        <i class="fas fa-external-link-alt"></i> View Details
                    </button>
                </div>
            `;
        }

        // Filter opportunities based on search criteria
        // Filter opportunities based on search criteria
        function filterOpportunities() {
            const searchTerm = searchInput.value.toLowerCase();
            const selectedFormat = formatFilter.value;
            const selectedScholarship = scholarshipFilter.value;
            const selectedDegreeType = degreeTypeFilter.value;
            const selectedFee = feeFilter.value;
            const selectedEstimatedCost = estimatedCostFilter.value;
            const selectedAccreditation = accreditationFilter.value;

            let filteredOpportunities = opportunitiesData.filter(opportunity => {
                const matchesSearch = 
                    opportunity.Institution.toLowerCase().includes(searchTerm) ||
                    (opportunity.Program && opportunity.Program.toLowerCase().includes(searchTerm)) ||
                    (opportunity.Department && opportunity.Department.toLowerCase().includes(searchTerm)) ||
                    (opportunity.Details && opportunity.Details.toLowerCase().includes(searchTerm));
                
                const matchesFormat = !selectedFormat || opportunity['Format '] === selectedFormat;
                const matchesScholarship = !selectedScholarship || opportunity.Scholarship === selectedScholarship;
                const matchesDegreeType = !selectedDegreeType || opportunity.DegreeType === selectedDegreeType;
                const matchesFee = !selectedFee || opportunity.OpportunityType === selectedFee;
                
                const matchesEstimatedCost = !selectedEstimatedCost || (() => {
                    const raw = (opportunity.EstimatedCost || '').toString().toLowerCase().trim();
                    const cleanRaw = raw.replace(/,/g, '');
                    const kMatch = cleanRaw.match(/(\d+\.?\d*)\s*k/i);
                    const num = kMatch ? parseFloat(kMatch[1]) * 1000 : parseFloat(cleanRaw.match(/[\d.]+/)?.[0] || 'NaN');
                    if (selectedEstimatedCost === 'Free') return raw === 'free' || num === 0;
                    if (selectedEstimatedCost === 'Varies per course') return raw === 'varies per course' || raw.startsWith('varies');
                    if (selectedEstimatedCost === '$1 – $500') return !isNaN(num) && num >= 1 && num <= 500;
                    if (selectedEstimatedCost === '$501 – $2,000') return !isNaN(num) && num >= 501 && num <= 2000;
                    if (selectedEstimatedCost === '$2,001 – $10,000') return !isNaN(num) && num >= 2001 && num <= 10000;
                    if (selectedEstimatedCost === '$10,001+') return !isNaN(num) && num >= 10001;
                    return false;
                })();
                const matchesAccreditation = !selectedAccreditation || opportunity.Accreditation === selectedAccreditation;
                
                return matchesSearch && matchesFormat && matchesScholarship && matchesDegreeType && matchesFee && matchesEstimatedCost && matchesAccreditation;
            });

            displayOpportunities(filteredOpportunities);
        }

        // Display opportunities in the grid
        function displayOpportunities(opportunitiesToShow) {
            if (opportunitiesToShow.length === 0) {
                opportunitiesContainer.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-search"></i>
                        <h3>No opportunities found</h3>
                        <p>Try adjusting your search criteria or filters to find more opportunities that match your interests.</p>
                    </div>
                `;
                return;
            }

            opportunitiesContainer.innerHTML = opportunitiesToShow.map(createOpportunityCard).join('');
            
            // Re-observe cards for animations
            observeCards();
        }

        // Animate numbers
        function animateNumber(element, target) {
            const start = 0;
            const duration = 1000;
            const startTime = Date.now();
            
            function update() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const current = Math.floor(progress * target);
                
                element.textContent = current;
                
                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }
            
            requestAnimationFrame(update);
        }

        // Set up intersection observer for card animations
        function observeCards() {
            const observerOptions = {
                threshold: 0.1,
                rootMargin: '0px 0px -50px 0px'
            };

            const observer = new IntersectionObserver(function(entries) {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.opportunity-card').forEach(card => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(30px)';
                card.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
                observer.observe(card);
            });
        }

        // Event listeners
        searchInput.addEventListener('input', filterOpportunities);
        formatFilter.addEventListener('change', filterOpportunities);
        scholarshipFilter.addEventListener('change', filterOpportunities);
        degreeTypeFilter.addEventListener('change', filterOpportunities);
        feeFilter.addEventListener('change', filterOpportunities);
        estimatedCostFilter.addEventListener('change', filterOpportunities);
        accreditationFilter.addEventListener('change', filterOpportunities);

        // Navigation scroll effect
        window.addEventListener('scroll', function() {
            const nav = document.querySelector('.nav');
            if (window.scrollY > 50) {
                nav.style.background = 'rgba(255, 255, 255, 0.95)';
                nav.style.backdropFilter = 'blur(15px)';
            } else {
                nav.style.background = 'rgba(255, 255, 255, 0.98)';
                nav.style.backdropFilter = 'blur(10px)';
            }
        });

        // Loading animation for apply buttons
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('apply-button') || e.target.closest('.apply-button')) {
                const button = e.target.classList.contains('apply-button') ? e.target : e.target.closest('.apply-button');
                const originalText = button.innerHTML;
                
                button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Opening...';
                button.disabled = true;
                
                setTimeout(() => {
                    button.innerHTML = originalText;
                    button.disabled = false;
                }, 1000);
            }
        });

        // Load data from Excel file
        async function loadExcelData() {
            try {
                const response = await window.fs.readFile('Opportunities at Universities for Afghans.xlsx');
                const workbook = XLSX.read(response);
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const rawData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
                
                const headers = rawData[0];
                const dataRows = rawData.slice(1);
                
                // Clear existing data and load from Excel
                opportunitiesData.length = 0;
                
                dataRows.forEach(row => {
                    const opportunity = {};
                    headers.forEach((header, index) => {
                        opportunity[header.trim()] = row[index] || '';
                    });
                    
                    // Only add if institution name exists
                    if (opportunity.Institution && opportunity.Institution.trim() !== '') {
                        opportunitiesData.push(opportunity);
                    }
                });
                
                console.log('Loaded', opportunitiesData.length, 'opportunities from Excel');
                
            } catch (error) {
                console.log('Could not load Excel file, using sample data');
            }
            
            // Initialize the page
            populateFilters();
            displayOpportunities(opportunitiesData);
        }

        // Initialize page when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            // Check if XLSX library is available
            if (typeof XLSX !== 'undefined') {
                loadExcelData();
            } else {
                // Load XLSX library dynamically
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
                script.onload = loadExcelData;
                document.head.appendChild(script);
            }
            
        });

        // Smooth scroll for internal links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });

        // Mobile menu toggle
        document.querySelector('.mobile-menu-btn').addEventListener('click', function() {
            const navLinks = document.querySelector('.nav-links');
            navLinks.classList.toggle('active');
            
            const icon = this.querySelector('i');
            if (navLinks.classList.contains('active')) {
                icon.classList.remove('fa-bars');
                icon.classList.add('fa-times');
            } else {
                icon.classList.remove('fa-times');
                icon.classList.add('fa-bars');
            }
        });
    </script>
</body>
</html>
